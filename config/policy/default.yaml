apiVersion: ringfence/v1
kind: PolicyPack
metadata:
  tenant: default
  version: 1
  parent: null
  author: ringfence
languages: [ar_tn, fr, en]
thresholds:
  watch: 30
  alert: 55
  intervene: 75
  sustain_turns: 2
  decay_half_life_s: 90
signals:
  AUTH_CLAIM: { weight: 12 }
  VERIF_INVERT: { weight: 30 }
  RAIL_UNUSUAL: { weight: 25 }
  REMOTE_ACCESS: { weight: 25 }
  URGENCY: { weight: 10 }
  SECRECY: { weight: 20 }
  CALLBACK_SUPPRESS: { weight: 18 }
  EMOTION_LEVER: { weight: 12 }
  SCRIPT_RIGIDITY: { weight: 8 }
  ESCALATION: { weight: 10 }
  REFUSE_SECRETS: { weight: -30 }
  OFFER_CALLBACK: { weight: -25 }
  NO_ACTION_ASKED: { weight: -20 }
  BRANCH_REFERRAL: { weight: -15 }
  # Dialogue acts: the same move the lexicon spells out phrase by phrase,
  # matched as (verb x target).  Weighted below their lexical counterparts
  # (VERIF_INVERT 30 / RAIL_UNUSUAL 25) because the two overlap on the
  # phrasings the lexicon already knows -- these earn their keep on the ones
  # it does not.
  ACT_DEMAND_SECRET: { weight: 10 }
  ACT_DEMAND_RAIL: { weight: 10 }
  ACT_REFUSAL: { weight: -25 }
combos:
  COMBO_CRITICAL: { bonus: 35, window_s: 90 }
  COMBO_ISOLATION: { bonus: 20, window_s: 60 }
  COMBO_CLASSIC: { bonus: 45, window_s: 120 }
judge:
  enabled: true
  model: gpt-oss:120b
  max_adjustment: 30
  trigger_score: 35
  max_calls_per_session: 12
interventions:
  channels: [in_ear, app_banner, guardian_push]
  cooldown_s: 60