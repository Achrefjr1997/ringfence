# Tenant scoping (T-6.4). An unknown tenant inherits the `default` profile
# but keeps its own id (and therefore its own `rf.<id>.*` subject space).
tenants:
  default:
    quota: 100
    allow_cloud: true
    consent_required: false
    languages: [en, fr, ar_tn]
    retain_audio: true      # P7: keep call recordings (legal basis on file); needs RF_RETAIN_AUDIO=true too

  acme:
    quota: 25
    allow_cloud: true
    consent_required: true
    languages: [en, fr]
    guardian_webhook_url: https://acme.example/ringfence/guardian
    guardian_webhook_secret_env: RF_GUARDIAN_SECRET_ACME
    retain_audio: true

  aircarrier:            # a no-egress carrier
    quota: 500
    allow_cloud: false
    consent_required: true
    languages: [ar_tn, fr]
    retain_audio: true
