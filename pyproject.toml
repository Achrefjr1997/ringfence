[project]
name = "ringfence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.*", "uvicorn[standard]==0.32.*", "websockets==13.*",
  "numpy==2.1.*", "scipy==1.14.*", "pyyaml==6.*", "pydantic==2.9.*",
  "pydantic-settings==2.*",
  "httpx==0.27.*", "sse-starlette==2.1.*", "soundfile==0.12.*",
  "webrtcvad-wheels==2.0.*", "orjson==3.10.*",  # -wheels fork: prebuilt, no pkg_resources
]

[project.optional-dependencies]
dev = ["pytest==8.*", "pytest-asyncio==0.24.*", "pytest-cov==5.*",
       "ruff==0.7.*", "mypy==1.13.*"]
judge = ["ollama>=0.4"]

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]
exclude = ["corpus*", "infra*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "invariant: must never regress",
  "needs_key: requires ASSEMBLYAI_API_KEY",
  "needs_ollama: requires the 'judge' extra and OLLAMA_API_KEY",
  "needs_dataset: requires the vendored external benchmark snapshot (corpus/external/)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true