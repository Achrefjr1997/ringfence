<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RingFence</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0c0f; --panel: #12151b; --raised: #1a1f27; --border: #252b35;
        --border-soft: #1c212a;
        --t0: #eef0f3; --t1: #aab0bb; --t2: #6a7280;
        --accent: #3dd4e0; --accent-ink: #04222a; --accent-dim: #3dd4e022;
        --calm: #43b581; --watch: #e0b23c; --alert: #e6853f; --intervene: #e94b40;
        --caller: #e09a5f; --callee: #63a8e0;
        --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        --shadow: 0 1px 2px #0006, 0 8px 24px -12px #0009;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--bg); color: var(--t0);
        font: 14px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility; }
      ::selection { background: var(--accent-dim); }
      a { color: var(--accent); text-decoration: none; transition: color .12s; }
      a:hover { color: #7ee7ef; }
      button { font: inherit; cursor: pointer; }
      input, select, textarea { font: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

      /* dark scrollbars */
      * { scrollbar-width: thin; scrollbar-color: #2c333f transparent; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-thumb { background: #2c333f; border-radius: 6px; border: 2px solid var(--bg); }
      *::-webkit-scrollbar-thumb:hover { background: #3a424f; }

      .mono { font-family: var(--mono); }
      .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--t2); }
      .sub { color: var(--t2); font-size: 13px; margin: -2px 0 22px; }

      .btn { font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid transparent;
        background: var(--accent); color: var(--accent-ink); transition: filter .12s, background .12s, border-color .12s; }
      .btn:hover:not(:disabled) { filter: brightness(1.08); }
      .btn:active:not(:disabled) { filter: brightness(.94); }
      .btn.ghost { background: transparent; border-color: #333a49; color: var(--t0); }
      .btn.ghost:hover:not(:disabled) { background: #ffffff08; border-color: #47506180; filter: none; }
      .btn.danger { background: #e94b400f; border-color: #e94b4055; color: var(--intervene); }
      .btn.danger:hover:not(:disabled) { background: #e94b401f; filter: none; }
      .btn:disabled { opacity: .45; cursor: default; }

      .field { display: block; width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 9px;
        border: 1px solid #2b323d; background: #0d1015; color: var(--t0); transition: border-color .12s, box-shadow .12s; }
      .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
      .field::placeholder { color: #565d69; }
      select.field { appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, #6a7280 50%), linear-gradient(135deg, #6a7280 50%, transparent 50%);
        background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat;
        padding-right: 30px; }

      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
        box-shadow: var(--shadow); }
      .row { display: flex; gap: 10px; align-items: center; }
      .grid { display: grid; gap: 14px; }

      .tablewrap { overflow-x: auto; border-radius: 10px; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
      thead th { position: sticky; top: 0; background: var(--panel); z-index: 1;
        color: var(--t2); font-weight: 600; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
      tbody tr { transition: background .1s; }
      tbody tr:nth-child(even) td { background: #ffffff04; }
      tbody tr:hover td { background: var(--accent-dim); }
      tbody tr:last-child td { border-bottom: none; }

      .pill { display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 600;
        padding: 2px 8px; border-radius: 999px; letter-spacing: .04em; border: 1px solid transparent; }
      .st-CALM { color: var(--calm); background: #43b5811c; border-color: #43b58133; }
      .st-WATCH { color: var(--watch); background: #e0b23c1c; border-color: #e0b23c33; }
      .st-ALERT { color: var(--alert); background: #e6853f1c; border-color: #e6853f33; }
      .st-INTERVENE { color: var(--intervene); background: #e94b401c; border-color: #e94b4033; }
      .st-RESOLVED { color: var(--t1); background: #ffffff10; border-color: #ffffff1f; }

      .badge { display: inline-block; min-width: 18px; text-align: center; font-family: var(--mono); font-size: 11px;
        padding: 1px 6px; border-radius: 999px; background: var(--raised); color: var(--t1); }

      .err { color: var(--intervene); font-size: 13px; }
      .ok { color: var(--calm); font-size: 13px; }
      .empty { color: var(--t2); font-size: 13px; padding: 22px 4px; text-align: center; }
      .loading { color: var(--t2); font-size: 13px; padding: 22px 4px; }
      .loading::after { content: "…"; animation: dots 1.2s steps(4, end) infinite; }
      @keyframes dots { 0% { content: "" } 25% { content: "." } 50% { content: ".." } 75% { content: "..." } }

      #app { display: flex; min-height: 100vh; }
      nav { width: 216px; flex-shrink: 0; background: #0c0f13; border-right: 1px solid var(--border-soft);
        padding: 18px 12px; display: flex; flex-direction: column; }
      nav .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font-weight: 700; font-size: 15px; letter-spacing: .01em; }
      nav a { position: relative; display: block; padding: 8px 12px; margin: 1px 0; border-radius: 8px; font-size: 13px; color: var(--t1);
        transition: background .1s, color .1s; }
      nav a:hover { background: #ffffff07; color: var(--t0); }
      nav a.on { background: var(--raised); color: var(--t0); font-weight: 600; }
      nav a.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px;
        background: var(--accent); border-radius: 0 3px 3px 0; }
      nav .who { margin-top: auto; font-size: 12px; color: var(--t2); padding: 12px 10px 0; border-top: 1px solid var(--border-soft); }
      nav .who a { display: inline; padding: 0; }

      main { flex: 1; padding: 28px 34px; max-width: 1120px; min-width: 0; }
      h1 { font-size: 21px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 4px; }

      .authwrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; width: 100%; padding: 20px; }
      .authbox { width: 380px; max-width: 100%; }

      @media (max-width: 720px) {
        #app { flex-direction: column; }
        nav { width: auto; flex-direction: row; overflow-x: auto; padding: 10px; align-items: center; }
        nav .brand { padding: 4px 10px; }
        nav a.on::before { display: none; }
        nav .who { display: none; }
        main { padding: 20px 16px; }
      }

      /* live view (drives app.js output) */
      .live-grid { display: grid; grid-template-columns: 90px 1fr; gap: 18px; }
      .gauge { width: 46px; background: var(--raised); border-radius: 6px; position: relative; overflow: hidden; min-height: 260px; }
      .gauge > span { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--calm); transition: height .2s ease, background .2s; }
      .gauge > span[data-state="WATCH"] { background: var(--watch); }
      .gauge > span[data-state="ALERT"] { background: var(--alert); }
      .gauge > span[data-state="INTERVENE"] { background: var(--intervene); }
      .glabel { font-family: var(--mono); font-weight: 700; font-size: 13px; margin-top: 8px; }
      .glabel[data-state="ALERT"] { color: var(--alert); }
      .glabel[data-state="INTERVENE"] { color: var(--intervene); }
      .glabel[data-state="WATCH"] { color: var(--watch); }
      #transcript { height: 300px; overflow: auto; padding: 10px 12px; font-family: var(--mono); font-size: 12px;
        background: #0d1015; border: 1px solid var(--border); border-radius: 8px; }
      .turn { padding: 4px 0; border-bottom: 1px solid #1a1e25; }
      .turn .role { display: inline-block; width: 66px; color: var(--t2); font-size: 10px; }
      .turn-CALLER .txt { color: var(--caller); }
      .turn-CALLEE .txt { color: var(--callee); }
      .turn-UNKNOWN .txt { color: var(--t2); }
      .chip { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px;
        background: #e94b4022; color: var(--alert); font-size: 10px; }
      #timeline { margin-top: 12px; }
      .tl { width: 100%; height: auto; }
      .tl .axis { stroke: #8886; } .tl .tick { fill: #8889; font-size: 9px; text-anchor: middle; }
      .tl .sig { stroke: var(--alert); stroke-width: 1.5; opacity: .55; }
      .tl .siglab { fill: var(--alert); font-size: 8px; }
      .tl .tr { stroke-width: 2; }
      .tl .tr-WATCH { stroke: var(--watch); } .tl .tr-ALERT { stroke: var(--alert); } .tl .tr-INTERVENE { stroke: var(--intervene); }
      .tl .trlab { font-family: var(--mono); font-size: 9px; text-anchor: middle; }
      .tl .trlab.tr-WATCH { fill: var(--watch); } .tl .trlab.tr-ALERT { fill: var(--alert); } .tl .trlab.tr-INTERVENE { fill: var(--intervene); }
      #cf { margin-top: 8px; font-size: 12px; color: var(--t2); font-style: italic; }
      .meter label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--t2); }
      .bar { height: 10px; background: #8883; border-radius: 3px; overflow: hidden; }
      .bar > span { display: block; height: 100%; width: 0; background: var(--calm); transition: width .05s linear; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/webapp.js"></script>
  </body>
</html>
