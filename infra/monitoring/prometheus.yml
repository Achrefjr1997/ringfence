# Prometheus config for the production stack (T-7.5).
# Scrapes the gateway's /metrics, evaluates alert-rules.yml, and hands
# firing alerts to Alertmanager.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: ringfence

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ringfence-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
