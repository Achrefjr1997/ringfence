# Run the production stack on your own machine, before there is a server.
#
#   cd infra/compose
#   cp .env.local-prod.example .env.local-prod   # then fill RF_SESSION_SECRET etc.
#   docker compose -f docker-compose.prod.yml -f docker-compose.local-prod.yml \
#     --env-file .env.local-prod up -d --build
#
# What this overlay changes vs docker-compose.prod.yml:
#   * the gateway image is BUILT here instead of pulled from GHCR
#   * the gateway port is also published on :8000 so you can hit it directly
#   * Caddy serves https://localhost with its own internal CA (RF_TLS in
#     .env.local-prod), so no public DNS / Let's Encrypt is involved
#
# Everything else is identical to production: same code, same RF_* surface,
# real Postgres, the circuit-breaking ASR router, the guardian dispatcher,
# Prometheus + Alertmanager.

services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    ports: ["8000:8000"]

  # one-shot schema apply before the gateway (the gateway also self-migrates,
  # but this mirrors the real deploy step in remote.sh)
  migrate:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    command: ["python", "-m", "packages.db.migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      RF_DATABASE_URL: ${RF_DATABASE_URL:?set RF_DATABASE_URL}
    restart: "no"

  prometheus:
    ports: ["9090:9090"]

  alertmanager:
    ports: ["9093:9093"]

  # http://localhost:3000 -- opens straight onto the RingFence dashboard,
  # no login (anonymous admin). RF_GRAFANA_ADMIN_PASSWORD still comes from
  # .env.local-prod (see .env.local-prod.example) for the admin account.
  grafana:
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SERVER_ROOT_URL: http://localhost:3000

  # published locally so you can psql in / point tools at it
  postgres:
    ports: ["5432:5432"]
