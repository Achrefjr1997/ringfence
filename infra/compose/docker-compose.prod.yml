# Production / staging topology (T-7.2c).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Standalone (not an overlay on docker-compose.yml) so there is exactly one
# file to read for what runs in production.  Differences from the local file:
#
#   * the gateway image is pulled by tag, never built here
#   * only Caddy faces the internet; the gateway is on the internal network
#   * RF_SESSION_SECRET, RF_DATABASE_URL, RF_DOMAIN, ACME_EMAIL and
#     POSTGRES_PASSWORD are required -- compose fails fast if the env-file
#     omits them (the "?err" form)
#   * every service restarts unless explicitly stopped; state is on volumes
#
# Secrets live in .env.prod, SOPS-encrypted at rest -- see docs/DEPLOY.md.
# Run `python -m packages.db.migrate` once before the first boot.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [gateway]
    ports: ["80:80", "443:443"]
    environment:
      RF_DOMAIN: ${RF_DOMAIN:?set RF_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      RF_ACME_CA: ${RF_ACME_CA:-}
      RF_TLS: ${RF_TLS:-}  # "" in prod; "tls internal" for a localhost run
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  gateway:
    image: ghcr.io/achrefjr1997/ringfence-gateway:${RF_IMAGE_TAG:?set RF_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      nats: {condition: service_started}
      redis: {condition: service_started}
      postgres: {condition: service_healthy}
    expose: ["8000"]
    environment:
      RF_MODE: production
      RF_DRY_RUN: ${RF_DRY_RUN:-true}
      RF_DEV_MODE: "0"
      RF_LOG_FORMAT: json
      RF_SESSION_SECRET: ${RF_SESSION_SECRET:?set RF_SESSION_SECRET}
      RF_DATABASE_URL: ${RF_DATABASE_URL:?set RF_DATABASE_URL}
      RF_NATS: nats://nats:4222
      RF_REDIS: redis://redis:6379
      RF_ASR_PROVIDER: ${RF_ASR_PROVIDER:-null}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      RF_JUDGE_TIMEOUT_S: ${RF_JUDGE_TIMEOUT_S:-2.5}  # Ollama Cloud p99 ~2s; 0.8s default times out
      RF_RETAIN_TRANSCRIPTS: ${RF_RETAIN_TRANSCRIPTS:-false}
      RF_DATA_ENCRYPTION_KEY: ${RF_DATA_ENCRYPTION_KEY:-}
      # P7 call-audio recording -- OFF unless you have a legal basis + DPA
      # (docs/LEGAL_AUDIO.md); a tenant also opts in via config/tenants.yaml
      RF_RETAIN_AUDIO: ${RF_RETAIN_AUDIO:-false}
      RF_AUDIO_RETENTION_DAYS: ${RF_AUDIO_RETENTION_DAYS:-7}
      RF_AUDIO_STORE_ROOT: /var/lib/ringfence/audio
    volumes:
      - call_audio:/var/lib/ringfence/audio

  nats:
    image: nats:2-alpine
    command: ["-js"]
    restart: unless-stopped

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ringfence}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-ringfence}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- monitoring (T-7.5) ------------------------------------------
  # Internal only. Reach Prometheus / Alertmanager / Grafana over an SSH
  # tunnel, or add your own authenticated ingress. Alerts route to
  # RF_ALERT_WEBHOOK_URL. Grafana loads the RingFence dashboard + Prometheus
  # datasource from infra/monitoring/grafana/provisioning at boot.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    depends_on: [gateway]
    volumes:
      - ./../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      RF_ALERT_WEBHOOK_URL: ${RF_ALERT_WEBHOOK_URL:?set RF_ALERT_WEBHOOK_URL}
    volumes:
      - ./../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am_data:/alertmanager
    # the alertmanager image has no env-var templating; expand the one
    # placeholder with busybox sed at boot ($$ -> a literal $ for the shell)
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed "s#https://alerts.placeholder.invalid/replace-me#$${RF_ALERT_WEBHOOK_URL}#g"
        /etc/alertmanager/alertmanager.yml > /tmp/am.yml &&
        exec /bin/alertmanager --config.file=/tmp/am.yml --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${RF_GRAFANA_ADMIN_PASSWORD:?set RF_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  prom_data:
  am_data:
  grafana_data:
  call_audio:  # P7 recordings (empty unless RF_RETAIN_AUDIO=true)
